workflows:
  ios-build:
    name: iOS — Build only (no signing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: SerialShelf.xcodeproj
        XCODE_SCHEME: SerialShelf
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Install XcodeGen
        script: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        script: |
          xcodegen generate
          xcodebuild -list -project "$XCODE_PROJECT"
      - name: Build for simulator
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -quiet
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: SerialShelf.xcodeproj
        XCODE_SCHEME: SerialShelf
        BUNDLE_ID: com.luebberspobre.serialshelf
        TEAM_ID: 6FY8HHKPS2
      # In Codemagic: App settings → Environment variables → this group.
      # APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents, base64 is fine)
      # APP_STORE_CONNECT_KEY_ID
      # APP_STORE_CONNECT_ISSUER_ID
      groups:
        - appstore_credentials
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Bump build number
        script: |
          set -euo pipefail
          NEW=$(( ${BUILD_NUMBER:-1} + 10 ))
          perl -pi -e "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$NEW\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml

      - name: Install XcodeGen
        script: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la
      - name: Set up code signing
        script: |
          set -euo pipefail

          # Codemagic's CLI reads APP_STORE_CONNECT_KEY_IDENTIFIER (not KEY_ID).
          export APP_STORE_CONNECT_KEY_IDENTIFIER="${APP_STORE_CONNECT_KEY_IDENTIFIER:-${APP_STORE_CONNECT_KEY_ID:-}}"

          normalise() {
            local value="$1"
            case "$value" in
              *BEGIN*)
                case "$value" in
                  *'\n'*) printf '%b' "$value" ;;
                  *) printf '%s' "$value" ;;
                esac
                ;;
              *)
                printf '%s' "$value" | base64 --decode 2>/dev/null || printf '%s' "$value"
                ;;
            esac
          }

          APP_STORE_CONNECT_PRIVATE_KEY="$(normalise "${APP_STORE_CONNECT_PRIVATE_KEY:-}")"
          CERTIFICATE_PRIVATE_KEY="$(normalise "${CERTIFICATE_PRIVATE_KEY:-}")"
          export APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY

          KEY_LEN=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | wc -c | tr -d ' ')
          KEY_ID_LEN=$(printf '%s' "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" | wc -c | tr -d ' ')
          ISSUER_LEN=$(printf '%s' "${APP_STORE_CONNECT_ISSUER_ID:-}" | wc -c | tr -d ' ')
          PEM_LEN=$(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | wc -c | tr -d ' ')

          echo "== credential sanity check =="
          echo "APP_STORE_CONNECT_PRIVATE_KEY length=$KEY_LEN"
          echo "APP_STORE_CONNECT_KEY_IDENTIFIER length=$KEY_ID_LEN"
          echo "APP_STORE_CONNECT_ISSUER_ID length=$ISSUER_LEN"
          echo "CERTIFICATE_PRIVATE_KEY length=$PEM_LEN"
          echo "p8 header  : ${APP_STORE_CONNECT_PRIVATE_KEY%%$'\n'*}"
          echo "pem header : ${CERTIFICATE_PRIVATE_KEY%%$'\n'*}"

          if [ "$KEY_ID_LEN" -eq 0 ]; then
            echo "ERROR: APP_STORE_CONNECT_KEY_IDENTIFIER is empty."
            echo "Rename the variable APP_STORE_CONNECT_KEY_ID to APP_STORE_CONNECT_KEY_IDENTIFIER."
            exit 1
          fi

          keychain initialize

          echo "== fetch signing files =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

          COUNT=0
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            if [ -d "$d" ]; then
              n=$(find "$d" -name '*.mobileprovision' | wc -l | tr -d ' ')
              echo "profiles in $d: $n"
              COUNT=$((COUNT + n))
            fi
          done
          echo "downloaded profiles: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no provisioning profile was downloaded"
            exit 1
          fi

          keychain add-certificates
          xcode-project use-profiles
      - name: Verify signing settings
        script: |
          echo "--- downloaded profiles ---"
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            echo "--- $d ---"
            ls -la "$d" 2>/dev/null || echo "(missing)"
          done
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -e "$p" ] || continue
            echo "profile file: $(basename "$p")"
            security cms -D -i "$p" | plutil -extract Name raw - || true
            security cms -D -i "$p" | plutil -extract application-identifier raw - || true
          done
          echo "--- resolved build settings ---"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null \
            | grep -E "(DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER)" || true

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-adhoc:
    name: iOS — Ad-hoc web install
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: SerialShelf.xcodeproj
        XCODE_SCHEME: SerialShelf
        BUNDLE_ID: com.luebberspobre.serialshelf
        TEAM_ID: 6FY8HHKPS2
        PAGES_URL: https://luebberspobre494-commits.github.io/SerialShelf/
      groups:
        - appstore_credentials
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Bump build number
        script: |
          set -euo pipefail
          NEW=$(( ${BUILD_NUMBER:-1} + 10 ))
          perl -pi -e "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$NEW\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml

      - name: Install XcodeGen
        script: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up ad-hoc signing
        script: |
          set -euo pipefail
          export APP_STORE_CONNECT_KEY_IDENTIFIER="${APP_STORE_CONNECT_KEY_IDENTIFIER:-${APP_STORE_CONNECT_KEY_ID:-}}"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --create
          keychain add-certificates
          xcode-project use-profiles
          PROFILE_PATH=$(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' 2>/dev/null | head -1)
          echo "profile: $PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -
          security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -
      - name: Archive and export ad-hoc IPA
        script: |
          set -euo pipefail
          PROFILE_PATH=$(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' 2>/dev/null | head -1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "using profile: $PROFILE_NAME"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/SerialShelf.xcarchive \
            -quiet

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/SerialShelf.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist build/ExportOptions.plist

          ls -la build/ios/ipa
      - name: Build install page
        script: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          SITE=_site
          rm -rf "$SITE" && mkdir -p "$SITE"
          cp "$IPA" "$SITE/SerialShelf.ipa"

          cat > "$SITE/manifest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${PAGES_URL}SerialShelf.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
                  <key>bundle-version</key><string>1.0.0</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>SerialShelf</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          cat > "$SITE/index.html" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Install SerialShelf</title>
            <style>
              body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
                     background:linear-gradient(160deg,#0e1a33,#2548b7); color:#fff;
                     min-height:100vh; display:flex; align-items:center; justify-content:center; }
              .card { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
                      border-radius:22px; padding:34px 26px; max-width:340px; text-align:center;
                      backdrop-filter:blur(12px); }
              h1 { font-size:22px; margin:0 0 8px; }
              p  { font-size:14px; line-height:1.6; color:rgba(255,255,255,.75); margin:0 0 22px; }
              a.btn { display:block; background:#fff; color:#12224a; text-decoration:none;
                      font-weight:600; font-size:17px; padding:15px; border-radius:14px; }
              .hint { margin-top:18px; font-size:12px; color:rgba(255,255,255,.55); }
              .links { margin-top:14px; font-size:12px; }
              .links a { color:rgba(255,255,255,.7); margin:0 8px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>SerialShelf</h1>
              <p>Serial numbers and warranty, on device.</p>
              <a class="btn" href="itms-services://?action=download-manifest&amp;url=${PAGES_URL}manifest.plist">Install on this iPhone</a>
              <div class="hint">Open in Safari. Tap Install, then trust the developer profile.</div>
              <div class="links"><a href="privacy.html">Privacy</a><a href="support.html">Support</a></div>
            </div>
          </body>
          </html>
          HTML

          cat > "$SITE/privacy.html" <<HTML2
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SerialShelf Privacy Policy</title>
            <style>
              body { margin:0; padding:40px 20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
                     background:#f7f8fa; color:#1b2436; line-height:1.7; }
              main { max-width:640px; margin:0 auto; }
              h1 { font-size:26px; margin:0 0 4px; }
              .sub { color:#7a869c; font-size:13px; margin:0 0 28px; }
              h2 { font-size:17px; margin:28px 0 8px; }
              p, li { font-size:15px; }
              ul { padding-left:20px; }
            </style>
          </head>
          <body>
            <main>
              <h1>Privacy Policy</h1>
              <p class="sub">SerialShelf for iOS - last updated 2026-11-04</p>
              <p>SerialShelf stores every record on your device. The app has no account system, no
                 analytics SDK, no advertising SDK and no backend server.</p>
              <h2>What we collect</h2>
              <p>Nothing. We do not collect, transmit or sell personal data.</p>
              <h2>What stays on your device</h2>
              <ul>
                <li>Item records you enter: name, brand, serial number, category, purchase date, warranty length, value and notes.</li>
                <li>Receipt photos you attach, stored inside the app container.</li>
                <li>Local notification schedules you create.</li>
              </ul>
              <h2>Camera and photos</h2>
              <p>When you scan a label or attach a receipt, the selected image is processed on device
                 using Apple's Vision framework. Text recognition runs locally. Images are never uploaded.</p>
              <h2>Notifications</h2>
              <p>Warranty reminders are scheduled locally with the system notification framework. They are
                 not sent from a server.</p>
              <h2>Exports</h2>
              <p>CSV export is created on device and handed to the share sheet you choose. We never see it.</p>
              <h2>Children</h2>
              <p>The app is not directed at children and collects no data from anyone.</p>
              <h2>Contact</h2>
              <p>Questions about this policy: luebberspobre494@gmail.com</p>
            </main>
          </body>
          </html>
          HTML2

          cat > "$SITE/support.html" <<HTML3
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SerialShelf Support</title>
            <style>
              body { margin:0; padding:40px 20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
                     background:#f7f8fa; color:#1b2436; line-height:1.7; }
              main { max-width:640px; margin:0 auto; }
              h1 { font-size:26px; margin:0 0 4px; }
              .sub { color:#7a869c; font-size:13px; margin:0 0 28px; }
              h2 { font-size:17px; margin:28px 0 8px; }
              p, li { font-size:15px; }
              ul { padding-left:20px; }
            </style>
          </head>
          <body>
            <main>
              <h1>Support</h1>
              <p class="sub">SerialShelf for iOS</p>
              <h2>Contact</h2>
              <p>Email luebberspobre494@gmail.com and we usually reply within two business days.</p>
              <h2>Common questions</h2>
              <ul>
                <li><strong>Where is my data stored?</strong> Only on this device. Deleting the app deletes the data, so export a CSV first.</li>
                <li><strong>How do I move to a new phone?</strong> Export a CSV from Settings, then import it on the new device.</li>
                <li><strong>Why no reminders?</strong> Allow notifications in Settings, then reopen the app.</li>
                <li><strong>Scanning does not find the serial.</strong> Photograph the label straight on, fill the frame, avoid glare.</li>
              </ul>
              <h2>Refunds</h2>
              <p>The app is free. Purchases, if any, are handled by Apple: reportaproblem.apple.com</p>
            </main>
          </body>
          </html>
          HTML3

          ls -la "$SITE"
      - name: Publish to GitHub Pages
        script: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.email "ci@codemagic.io"
          git config user.name "Codemagic CI"
          git add -A
          git commit -qm "build ${BUILD_NUMBER}"
          git remote add origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/luebberspobre494-commits/SerialShelf.git"
          git push -f origin gh-pages
          echo "published to ${PAGES_URL}"
    artifacts:
      - build/ios/ipa/*.ipa
